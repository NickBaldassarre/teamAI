# teamAI Agent Registry
#
# Each entry describes an agent that can be used for task execution.
# The orchestrator uses capability profiles to pick the best agent for a task.
#
# Fields:
#   id          - unique identifier used in routing decisions
#   name        - human-readable label
#   type        - local_mlx | openai | google | anthropic | custom
#   model_id    - model string passed to the backend
#   capabilities - list of task routes this agent handles well
#   max_context_tokens - approximate usable context window
#   cost        - free | cheap | moderate | expensive (relative cost per run)
#   latency     - low | medium | high (expected wall-clock latency)
#   requires_env - list of env vars that must be set for this agent to work
#   notes       - freeform description

agents:

  - id: deterministic_patcher
    name: "Deterministic Patch Compiler"
    type: deterministic
    model_id: "deterministic"
    capabilities:
      - deterministic_patch
    max_context_tokens: 0
    cost: free
    latency: low
    requires_env: []
    rate_limit_sensitivity: low
    notes: >
      Compiler-backed narrow write route. Produces approval-gated patches
      without invoking a model and must always be labeled deterministic.

  - id: deterministic_inspector
    name: "Deterministic Repository Inspector"
    type: deterministic
    model_id: "deterministic"
    capabilities:
      - repository_inspection
    max_context_tokens: 0
    cost: free
    latency: low
    requires_env: []
    rate_limit_sensitivity: low
    notes: >
      Deterministic repository reconnaissance and synthesis route for
      inspection-style prompts that do not require model-authored council text.

  - id: local_gemma
    name: "Gemma 4 2B 4-bit (Local MLX)"
    type: local_mlx
    model_id: "mlx-community/gemma-4-2b-it-4bit"
    capabilities:
      - multi_agent_loop
      - codex_handoff
    max_context_tokens: 2048
    cost: free
    latency: low
    requires_env: []
    rate_limit_sensitivity: low
    notes: >
      Default local reasoning agent. Runs fully offline on Apple Silicon via MLX.
      Best for short local multi-agent loops and reconnaissance that prepares a
      broader verified handoff when needed.

  - id: local_gemma_large
    name: "Gemma 4 12B 4-bit (Local MLX)"
    type: local_mlx
    model_id: "mlx-community/gemma-4-12b-it-4bit"
    capabilities:
      - explicit_write_loop
      - multi_agent_loop
      - codex_handoff
    max_context_tokens: 4096
    cost: free
    latency: medium
    requires_env: []
    rate_limit_sensitivity: low
    notes: >
      Larger local model for machines with 32GB+ unified memory.
      Can handle explicit write loops and local verified-handoff execution
      that the 2B model struggles with.

  - id: codex
    name: "GPT-5.4 / Codex (OpenAI)"
    type: openai
    model_id: "gpt-5.4"
    capabilities:
      - verified_handoff_execution
    max_context_tokens: 128000
    cost: expensive
    latency: medium
    requires_env:
      - OPENAI_API_KEY
    rate_limit_sensitivity: high
    notes: >
      Primary cloud execution engine for complex multi-file coding tasks.
      Receives a semantic skeleton from the local system and returns a unified
      diff patch for verification.

  - id: gemini_pro
    name: "Gemini 2.5 Pro (Google)"
    type: google
    model_id: "gemini-2.5-pro"
    capabilities:
      - verified_handoff_execution
    max_context_tokens: 1000000
    cost: expensive
    latency: medium
    requires_env:
      - GEMINI_API_KEY
    rate_limit_sensitivity: high
    notes: >
      Alternative verified-handoff engine with a very large context window.
      Useful for whole-repository tasks where the full codebase needs to fit
      in the downstream execution model.

  - id: gemini_cli_local_gemma
    name: "Gemma 3 4B (Local via Gemini CLI)"
    type: gemini_cli
    model_id: "gemma-3-4b-it"
    capabilities:
      - verified_handoff_execution
      - codex_handoff
    max_context_tokens: 8192
    cost: free
    latency: medium
    requires_env: []
    rate_limit_sensitivity: low
    notes: >
      Verified-handoff engine that drives the local Gemma model through the
      official Google Gemini CLI (`gemini`) on this machine. Run
      `gemini gemma setup` once to provision the local Gemma server, then
      invocations through this agent stay fully offline and quota-free while
      reusing the same handoff prompt format as the cloud engines.

  - id: grok_fast
    name: "Grok 4.20 Reasoning (xAI)"
    type: xai
    model_id: "grok-4.20-reasoning"
    capabilities:
      - verified_handoff_execution
    max_context_tokens: 256000
    cost: moderate
    latency: low
    requires_env:
      - XAI_API_KEY
    rate_limit_sensitivity: high
    notes: >
      Fast OpenAI-compatible xAI handoff engine. Good default when we want
      stronger reasoning than local Gemma without immediately spending Codex
      budget or pushing the most constrained quota pool.

  - id: claude_desktop
    name: "Claude Desktop Control (Anthropic)"
    type: anthropic
    model_id: "claude-sonnet-4-20250514"
    capabilities:
      - desktop_control
    max_context_tokens: 200000
    cost: moderate
    latency: high
    requires_env:
      - ANTHROPIC_API_KEY
    rate_limit_sensitivity: medium
    notes: >
      Desktop automation agent using Claude Computer Use. Executes OS-level
      tasks — opening apps, clicking UI elements, filling forms, reading
      screen content — via screenshot-driven interaction.  Not a code engine;
      use for tasks that require human-like computer interaction.

routing:
  # Default local agent used when no cloud agent is specified
  default_local: local_gemma

  # Cloud agent used for codex_handoff route by default
  default_cloud: codex

  # Minimum capability match required to use an agent
  # (agent must list ALL requested capabilities)
  require_all_capabilities: false

  # If true, prefer cheaper agents when multiple match
  prefer_lower_cost: true

  recent_success_window: 8
  success_rate_weight: 8
  repair_rate_weight: 12
  broken_repair_rate: 0.35
  broken_route_penalty: 18
  memory_pressure_penalty: 6
  local_preference_bonus: 2
  free_local_bonus: 6
  model_success_weight: 10
  model_latency_weight: 3
  quota_pressure_weight: 18
  exploration_weight: 3

  task_profiles:
    deterministic_patch:
      base_score: 0
      score_if:
        deterministic_candidate: 18
        workspace_write: 4
        explicit_write: 5
        continuation_context: -4
        repository_inspection: -12
        broad_coding: -14

    repository_inspection:
      base_score: 0
      score_if:
        repository_inspection: 18
        read_only: 2
        explicit_write: -10
        deterministic_candidate: -10
        broad_coding: -6

    explicit_write_loop:
      base_score: 0
      score_if:
        explicit_write: 16
        workspace_write: 4
        deterministic_candidate: -10
        repository_inspection: -10
        broad_coding: -4

    codex_handoff:
      base_score: 0
      score_if:
        broad_coding: 18
        workspace_write: 2
        repository_inspection: -8
        deterministic_candidate: -12

    multi_agent_loop:
      base_score: 1
      score_if:
        continuation_context: 8
        broad_coding: -4

    desktop_control:
      base_score: 0
      score_if:
        desktop_task: 20
        broad_coding: -16
        deterministic_candidate: -18
        repository_inspection: -18
